{% extends "global/Page.html" %}
{% load otree static %}

{% block title %}
    <title>Please wait - [Main Category] - [Sub Category]</title>
{% endblock %}

{% block content %}
    {% block title %}
        <div class="text-center">Please Wait</div>
    {% endblock %}
    <h3 class="text-center mb-3">[Title text]</h3>
    <div class="container d-flex justify-content-center align-items-center mb-3">
        <img src="{% static 'global/custom_templates/assets/img/example_img.png' %}" class="img-fluid w-25" alt="image/png">
        <img src="{% static 'global/custom_templates/assets/img/example_img.png' %}" class="img-fluid w-25" alt="image/png">
    </div>
    <div class="d-flex flex-column justify-content-center align-items-center">
        <div class="spinner-border spinnerSize text-primary mb-3" role="status"></div>
        <h5 class="text-center text-muted m-0">[Description text]</h5>
    </div>
    <div class="d-flex justify-content-between align-items-center mt-5">
        <button class="otree-btn btn btn-primary w-25">
            <span>Next Templates</span>
            <i class="fa-solid fa-forward-fast"></i>
        </button>
        <span class="text-muted text-center">Developed by DASW Project</span>
    </div>
{% endblock %}
